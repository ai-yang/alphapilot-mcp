- id: mcp-alphapilot
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: alphapilot
    transport: stdio
    command: node
    args: ["/absolute/path/alphapilot-mcp/dist/cli.js", "serve", "--transport", "stdio"]
    env:
      ALPHAPILOT_BASE_URL: !!js process.env.ALPHAPILOT_BASE_URL
      ALPHAPILOT_RESEARCH_TOKEN: !!js process.env.ALPHAPILOT_RESEARCH_TOKEN
